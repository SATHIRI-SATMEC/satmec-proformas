<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión de Clientes, Proformas y Facturas</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#18243d;--mut:#6a7489;--bd:#d9dfeb;--pri:#14284b;--btn:#14284b;--btx:#fff;--acc:#f58220;--ok:#1f8a4c;--bad:#c0392b;--inp:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--tx:#e7ecf7;--mut:#9aa6c0;--bd:#2c3a58;--pri:#8fb0ff;--btn:#2f5bb7;--btx:#fff;--ok:#4cc382;--bad:#ff7b6b;--inp:#101a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--tx:#e7ecf7;--mut:#9aa6c0;--bd:#2c3a58;--pri:#8fb0ff;--btn:#2f5bb7;--btx:#fff;--ok:#4cc382;--bad:#ff7b6b;--inp:#101a2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
header.top h1{font-size:19px;margin:0;color:var(--pri);flex:1}header.top img{height:46px;border-radius:4px}header.top img.ban{height:auto;width:100%;display:block;border-radius:8px}.sheet .ban{display:block;width:calc(100% + 52px);margin:-26px -26px 14px;border-radius:6px 6px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;border-bottom:3px solid var(--acc);margin-bottom:14px}
nav button{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-size:14px}
nav button.on{background:var(--btn);color:var(--btx);border-color:var(--btn)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px;color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--acc);border-radius:10px;padding:12px}.stat b{display:block;font-size:22px;color:var(--pri)}.stat span{color:var(--mut);font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--inp);color:var(--tx);font:inherit}
.btn{background:var(--btn);color:var(--btx);border:0;padding:8px 14px;border-radius:7px;cursor:pointer;font:inherit;font-size:14px}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.acc{background:var(--acc);color:#1a1a1a}.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}.btn.sm{padding:4px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.row .g{flex:1 1 160px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{color:var(--mut);font-size:12px;text-transform:uppercase}
td.r,th.r{text-align:right;white-space:nowrap}.badge{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.b-ok{color:var(--ok);border-color:var(--ok)}.b-bad{color:var(--bad);border-color:var(--bad)}.b-w{color:var(--acc);border-color:var(--acc)}
.tot{margin-left:auto;max-width:280px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .t{font-weight:700;font-size:17px;color:var(--pri);border-top:2px solid var(--pri)}
.cathead td{background:var(--bg);color:var(--pri);font-weight:700;font-size:13px}td input,td select{padding:5px 6px;font-size:13px}.fh{margin:16px 0 8px;color:#14284b;font-size:15px}.bl{position:relative;padding-left:20px;margin:0 0 6px;text-align:justify}.bl:before{content:'';position:absolute;left:4px;top:.55em;width:7px;height:7px;background:#f58220}.bl.plain{padding-left:0}.bl.plain:before{display:none}.sheet table.sp td{vertical-align:middle}.sheet table.sp th{text-align:center}.btn.wa{background:#25D366;color:#10341f}.sheet .bank{border-left:5px solid #f58220;background:#f3f5f9;padding:10px 14px;margin:12px 0;border-radius:4px;font-size:14px}.mut{color:var(--mut);font-size:13px}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btx);padding:9px 16px;border-radius:8px;z-index:9}
.sheet{--tx:#111;--mut:#555;--bd:#bbb;--pri:#14284b;background:#fff;color:#111;border:1px solid var(--bd);padding:26px;border-radius:6px}
.sheet h3{margin:0;color:#14284b}.sheet th{background:#14284b;color:#fff}.sheet td,.sheet th{border:1px solid #bbb}.sheet .hd{display:flex;justify-content:space-between;gap:14px;border-bottom:4px solid #f58220;padding-bottom:10px;margin-bottom:12px}
.sheet .tot .t{color:#14284b;border-color:#14284b}
@media (max-width:640px){.grid{grid-template-columns:1fr}.grid>*{grid-column:auto!important;min-width:0}.tw table input,.tw table select{min-width:96px}.tw table td:nth-child(2) input{min-width:70px}.card{padding:12px}.wrap{padding:10px}input[type=date]{min-width:0;max-width:100%}.btn{padding:10px 12px}.row{flex-wrap:wrap}}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden}
@media print{.sheet .ban{width:100%;margin:0 0 12px;border-radius:0}body{background:#fff}.noprint{display:none!important}.wrap{padding:0;max-width:none}.sheet{border:0;padding:0}}
</style>

      case 'areas':{const cw=[215,70,W-285],tt=r2(b.rows.reduce((a,x)=>a+(+x.m||0),0));need(60);let xx=MX;
        rect(MX,y,W,20,NAVY);['ÁREA','M²','OBSERVACIÓN'].forEach((h,i)=>{text(h,MX+cw.slice(0,i).reduce((a,v)=>a+v,0)+cw[i]/2,y+13.5,8.5,{b:1,col:'#FFFFFF',al:'c'})});y+=20;
        const rowsAll=b.rows.map(r=>[r.n||'',fq(r.m),r.o||'']).concat([['TOTAL',fq(tt),'']]);
        rowsAll.forEach((r,ri)=>{const l1=wrap(r[0],cw[0]-12,9.5),l3=wrap(r[2],cw[2]-12,9.5),n=Math.max(l1.length,l3.length,1),rh=n*12+10,last=ri==rowsAll.length-1;need(rh);
          let x0=MX;cw.forEach(w=>{rect(x0,y,w,rh,last?'#F3F5F9':null,'#9AA6BB',.5);x0+=w});
          l1.forEach((l,i)=>text(l,MX+6,y+14+i*12,9.5,{b:last}));text(r[1],MX+cw[0]+cw[1]/2,y+14,9.5,{b:last,al:'c'});l3.forEach((l,i)=>text(l,MX+cw[0]+cw[1]+6,y+14+i*12,9.5));y+=rh});y+=14;break}
      case 'items':itemsBlock();break;
      case 'note':para(b.t,{sz:8.5,col:GR,after:4});break;
      case 'specs':specsBlock(b.rows);break;
      case 'bank':bankBlock();break;
      case 'sig':need(70);y+=30;[c.signer,c.role,c.name].forEach(x=>{text(x||'',MX,y,10,{b:1});y+=13});break;
    }});
  }else{
    [['Cliente:',k.name],['RUC/CI:',k.ruc],['Dirección:',k.addr],['Contacto:',[k.tel,k.email].filter(Boolean).join('  ·  ')]].forEach(([l,v])=>{if(!v)return;text(l,MX,y,10,{b:1});wrap(v,W-62,10).forEach(ln=>{text(ln,MX+62,y,10);y+=13})});
    y+=8;itemsBlock();
    const para2=(title,txt)=>{const ls=wrap(txt,W,9.5);need(16+ls.length*12+8);text(title,MX,y,10.5,{b:1,col:NAVY});y+=14;ls.forEach(l=>{text(l,MX,y,9.5);y+=12});y+=8};
    if(d.notes)para2('Notas',d.notes);if(c.terms)para2('Forma de pago',c.terms);
    bankBlock();
    if(d.type=='p')para('Al final de la obra se ajustará el metraje de ser necesario y se facturan los metros reales ejecutados.',{sz:8.5,col:GR});
  }
  pages.forEach((p,i)=>{ops=p;rect(MX,PH-52,W,1.2,NAVY);text((c.name+' | '+c.sub).toUpperCase(),PW/2,PH-38,8,{b:1,col:NAVY,al:'c'});text('Página '+(i+1)+' de '+pages.length,PW/2,PH-26,7.5,{col:GR,al:'c'})});
  // ensamblar PDF
  const parts=[],offs=[];let off=0;
  const sb=s=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a};
  const push=u=>{parts.push(u);off+=u.length};
  const obj=(id,...bs)=>{offs[id]=off;push(sb(id+' 0 obj\n'));bs.forEach(b=>push(typeof b=='string'?sb(b):b));push(sb('\nendobj\n'))};
  const base=lg?6:5,n=pages.length;
  push(sb('%PDF-1.4\n'));
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>(base+2*i+1)+' 0 R').join(' ')}] >>`);
  obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  if(lg)obj(5,`<< /Type /XObject /Subtype /Image /Width ${lg.w} /Height ${lg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${lg.bytes.length} >>\nstream\n`,lg.bytes,'\nendstream');
  pages.forEach((p,i)=>{const data=sb(p.join('\n'));
    obj(base+2*i,`<< /Length ${data.length} >>\nstream\n`,data,'\nendstream');
    obj(base+2*i+1,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Contents ${base+2*i} 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${lg?' /XObject << /Im1 5 0 R >>':''} >> >>`)});
  const total=base+2*n,xr=off;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(sb(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`));
  return new Blob(parts,{type:'application/pdf'});
}
function pdfName(d){const k=(cl(d.clientId).name||'cliente').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'').slice(0,30);return `${d.type=='p'?'Proforma':'Factura'}_${d.num}_${k}.pdf`}
async function pdfFor(id){const d=S.docs.find(x=>x.id==id);return{d,blob:await makePdf(d),name:pdfName(d)}}
async function dl(blob,name){try{if(window.claude&&claude.use){const D=await claude.use('downloads');if(D){await D.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code=='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

/* ===== carpeta de guardado (Chrome / Edge de computador) ===== */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('gestion_h',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function hget(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function hset(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
hget('dir').then(h=>{if(h){dirName=h.name;if(tab=='cfg'&&!ed&&!vw)R()}});
async function chooseFolder(){
  if(!window.showDirectoryPicker){toast('Tu navegador no permite elegir carpeta. Usa Chrome o Edge en computador.');return false}
  try{const h=await showDirectoryPicker({mode:'readwrite'});await hset('dir',h);dirName=h.name;if(tab=='cfg'&&!ed&&!vw)R();toast('Carpeta elegida: '+h.name);return true}
  catch(e){if(e.name!='AbortError')toast('No se pudo elegir la carpeta');return false}}
async function toFolder(d,blob,name){
  try{const h=await hget('dir');if(!h)return false;
    let p=await h.queryPermission({mode:'readwrite'});if(p!=='granted')p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')return false;
    const sub=await h.getDirectoryHandle(d.type=='p'?'Proformas':'Facturas',{create:true});
    const fh=await sub.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(blob);await w.close();return true}
  catch(e){console.error(e);return false}}
async function autoSave(id){if(S.cfg.auto===false||!window.showDirectoryPicker)return;
  try{const{d,blob,name}=await pdfFor(id);if(await toFolder(d,blob,name))toast('PDF guardado en tu carpeta ('+(d.type=='p'?'Proformas':'Facturas')+')')}catch(e){console.error(e)}}

/* ===== acciones del PDF y WhatsApp ===== */
function waNum(t){let n=String(t||'').replace(/\D/g,'');if(!n)return'';if(n.startsWith('00'))n=n.slice(2);if(n[0]=='0')n='593'+n.slice(1);else if(n.length==9&&n[0]=='9')n='593'+n;return n}
function waGuide(name){let o=document.getElementById('waG');if(o)o.remove();o=document.createElement('div');o.id='waG';
  o.style.cssText='position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML='<div style="background:#fff;border-radius:12px;max-width:420px;width:100%;padding:22px;font:14px/1.5 system-ui,sans-serif;color:#1b2740"><h3 style="margin:0 0 8px;color:#12244a">PDF listo para WhatsApp</h3><p style="margin:0 0 10px">El PDF <b>'+esc(name)+'</b> se descargó y se abrió el chat de WhatsApp con el mensaje.</p><ol style="margin:0 0 14px;padding-left:20px"><li>En WhatsApp pulsa el clip 📎 → <b>Documento</b>.</li><li>Elige el PDF (carpeta <b>Descargas</b>).</li><li>Envía.</li></ol><p style="margin:0 0 14px;color:#667;font-size:12.5px">En el celular el PDF se adjunta automáticamente desde el menú de compartir.</p><button class="btn" onclick="document.getElementById(\'waG\').remove()">Entendido</button></div>';
  document.body.appendChild(o)}
async function actPdf(id,mode){
  try{const{d,blob,name}=await pdfFor(id),k=cl(d.clientId);
    if(mode=='dl'){dl(blob,name);toast('PDF descargado')}
    else if(mode=='folder'){let ok=await toFolder(d,blob,name);
      if(!ok&&window.showDirectoryPicker&&!(await hget('dir'))){if(await chooseFolder())ok=await toFolder(d,blob,name)}
      if(ok)toast('PDF guardado en la carpeta '+(d.type=='p'?'Proformas':'Facturas'));
      else{dl(blob,name);toast(window.showDirectoryPicker?'No se pudo guardar en la carpeta; se descargó el PDF':'Tu navegador no permite elegir carpeta; se descargó el PDF')}}
    else{const msg=`Estimado/a ${k.name}, le saluda ${S.cfg.name} ${S.cfg.sub}. Adjunto la ${d.type=='p'?'proforma':'factura'} ${d.num} por ${money(dtot(d))}. Quedamos atentos a sus comentarios.`;
      const f=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name,text:msg});return}catch(e){if(e.name=='AbortError')return}}
      dl(blob,name);const n=waNum(k.tel);
      window.open((n?'https://wa.me/'+n+'?text=':'https://api.whatsapp.com/send?text=')+encodeURIComponent(msg),'_blank');
      waGuide(name)}
  }catch(e){console.error(e);toast('No se pudo generar el PDF')}}
